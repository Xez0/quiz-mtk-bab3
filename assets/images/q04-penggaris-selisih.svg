<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Perbandingan panjang spidol 11 cm dan paku 4 cm pada penggaris">
  <rect width="560" height="220" rx="16" fill="#f8fafc"/>
  <!-- Guide lines -->
  <line x1="36" y1="24" x2="36" y2="145" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="188" y1="84" x2="188" y2="145" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="454" y1="24" x2="454" y2="145" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Top: Spidol Hijau (0 to 11 cm => x=36 to 454) -->
  <g transform="translate(0, 28)">
    <!-- Cap on right up to 454 -->
    <rect x="36" y="6" width="304" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
    <rect x="62" y="11" width="210" height="18" rx="3" fill="#4ade80"/>
    <text x="167" y="24" font-family="Fredoka, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">SPIDOL</text>
    <rect x="340" y="4" width="114" height="32" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="2.2"/>
    <rect x="352" y="0" width="8" height="4" fill="#15803d"/>
  </g>

  <!-- Bottom: Paku Baja (0 to 4 cm => x=36 to 188) -->
  <g transform="translate(0, 88)">
    <!-- Nail head at x=36 -->
    <rect x="36" y="4" width="10" height="26" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <!-- Nail shaft to x=168 -->
    <rect x="46" y="11" width="122" height="12" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <!-- Pointed tip to x=188 -->
    <polygon points="168,11 188,17 168,23" fill="#94a3b8" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
    <text x="202" y="22" font-family="Fredoka, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Paku</text>
  </g>

  <!-- Ruler -->
  <rect x="20" y="145" width="520" height="58" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="2.5"/>
  <line x1="36.0" y1="145" x2="36.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="36.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">0</text>
    <line x1="55.0" y1="145" x2="55.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="74.0" y1="145" x2="74.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="74.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
    <line x1="93.0" y1="145" x2="93.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="112.0" y1="145" x2="112.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="112.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">2</text>
    <line x1="131.0" y1="145" x2="131.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="150.0" y1="145" x2="150.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="150.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">3</text>
    <line x1="169.0" y1="145" x2="169.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="188.0" y1="145" x2="188.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="188.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">4</text>
    <line x1="207.0" y1="145" x2="207.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="226.0" y1="145" x2="226.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="226.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">5</text>
    <line x1="245.0" y1="145" x2="245.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="264.0" y1="145" x2="264.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="264.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">6</text>
    <line x1="283.0" y1="145" x2="283.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="302.0" y1="145" x2="302.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="302.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">7</text>
    <line x1="321.0" y1="145" x2="321.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="340.0" y1="145" x2="340.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="340.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">8</text>
    <line x1="359.0" y1="145" x2="359.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="378.0" y1="145" x2="378.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="378.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">9</text>
    <line x1="397.0" y1="145" x2="397.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="416.0" y1="145" x2="416.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="416.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">10</text>
    <line x1="435.0" y1="145" x2="435.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="454.0" y1="145" x2="454.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="454.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">11</text>
    <line x1="473.0" y1="145" x2="473.0" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="492.0" y1="145" x2="492.0" y2="167" stroke="#1e293b" stroke-width="2.2"/>
    <text x="492.0" y="187" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">12</text>
  <text x="530" y="185" font-family="Nunito, Arial, sans-serif" font-size="13" font-weight="800" fill="#854d0e" text-anchor="end">cm</text>
</svg>
