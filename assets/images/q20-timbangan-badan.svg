<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" role="img" aria-label="Timbangan badan menunjuk angka 32 kg">
  <rect width="380" height="250" rx="16" fill="#f8fafc"/>
  <!-- Bathroom scale outer body -->
  <rect x="70" y="18" width="240" height="214" rx="28" fill="#38bdf8" stroke="#0284c7" stroke-width="3.5"/>
  <rect x="82" y="30" width="216" height="190" rx="22" fill="#e0f2fe"/>

  <!-- Wide Meter display window with clear margin for kg label -->
  <rect x="96" y="38" width="188" height="64" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <line x1="134" y1="68" x2="134" y2="84" stroke="#0f172a" stroke-width="2.4"/><text x="134" y="60" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">30</text><line x1="148" y1="74" x2="148" y2="84" stroke="#64748b" stroke-width="1.5"/><line x1="162" y1="68" x2="162" y2="84" stroke="#0f172a" stroke-width="2.4"/><text x="162" y="60" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">31</text><line x1="176" y1="74" x2="176" y2="84" stroke="#64748b" stroke-width="1.5"/><line x1="190" y1="68" x2="190" y2="84" stroke="#0f172a" stroke-width="2.4"/><text x="190" y="60" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">32</text><line x1="204" y1="74" x2="204" y2="84" stroke="#64748b" stroke-width="1.5"/><line x1="218" y1="68" x2="218" y2="84" stroke="#0f172a" stroke-width="2.4"/><text x="218" y="60" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">33</text><line x1="232" y1="74" x2="232" y2="84" stroke="#64748b" stroke-width="1.5"/><line x1="246" y1="68" x2="246" y2="84" stroke="#0f172a" stroke-width="2.4"/><text x="246" y="60" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">34</text>
  <!-- Red fixed pointer at center x=190 (pointing to 32) -->
  <line x1="190" y1="84" x2="190" y2="99" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
  <polygon points="190,78 184,88 196,88" fill="#e11d48"/>
  <text x="268" y="88" font-family="Fredoka, Arial, sans-serif" font-size="13" font-weight="700" fill="#0284c7" text-anchor="middle">kg</text>

  <!-- Anti-slip grip pads & Cute footprints -->
  <rect x="100" y="118" width="76" height="84" rx="14" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="204" y="118" width="76" height="84" rx="14" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Left foot -->
  <ellipse cx="138" cy="166" rx="16" ry="26" fill="#0ea5e9" opacity="0.45"/>
  <circle cx="126" cy="134" r="4" fill="#0ea5e9" opacity="0.45"/>
  <circle cx="136" cy="131" r="4.5" fill="#0ea5e9" opacity="0.45"/>
  <circle cx="146" cy="133" r="4" fill="#0ea5e9" opacity="0.45"/>
  <!-- Right foot -->
  <ellipse cx="242" cy="166" rx="16" ry="26" fill="#0ea5e9" opacity="0.45"/>
  <circle cx="234" cy="133" r="4" fill="#0ea5e9" opacity="0.45"/>
  <circle cx="244" cy="131" r="4.5" fill="#0ea5e9" opacity="0.45"/>
  <circle cx="254" cy="134" r="4" fill="#0ea5e9" opacity="0.45"/>
</svg>
