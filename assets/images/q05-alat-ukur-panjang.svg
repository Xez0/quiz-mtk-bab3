<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Empat gambar alat ukur berbeda berlabel Alat 1, 2, 3, dan 4">
  <rect width="560" height="220" rx="16" fill="#f8fafc"/>

  <!-- Card 1: Penggaris -->
  <g transform="translate(16, 16)">
    <rect width="120" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="38" y="24" width="44" height="115" rx="5" fill="#38bdf8" stroke="#0284c7" stroke-width="2.2" transform="rotate(20, 60, 82)"/>
    <g transform="rotate(20, 60, 82)" stroke="#0369a1" stroke-width="1.8">
      <line x1="38" y1="36" x2="50" y2="36"/>
      <line x1="38" y1="50" x2="46" y2="50"/>
      <line x1="38" y1="64" x2="50" y2="64"/>
      <line x1="38" y1="78" x2="46" y2="78"/>
      <line x1="38" y1="92" x2="50" y2="92"/>
      <line x1="38" y1="106" x2="46" y2="106"/>
      <line x1="38" y1="120" x2="50" y2="120"/>
    </g>
    <rect x="20" y="150" width="80" height="26" rx="13" fill="#e0f2fe"/>
    <text x="60" y="168" font-family="Fredoka, Arial, sans-serif" font-size="14" font-weight="700" fill="#0284c7" text-anchor="middle">Alat 1</text>
  </g>

  <!-- Card 2: Meteran Pita Kain -->
  <g transform="translate(152, 16)">
    <rect width="120" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Curled yellow ribbon -->
    <circle cx="54" cy="70" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="54" cy="70" r="14" fill="#ffffff" stroke="#ca8a04" stroke-width="2.5"/>
    <path d="M 60 97 C 75 112, 95 105, 102 126" fill="none" stroke="#facc15" stroke-width="14" stroke-linecap="round"/>
    <path d="M 60 97 C 75 112, 95 105, 102 126" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="3,5"/>
    <rect x="20" y="150" width="80" height="26" rx="13" fill="#fef3c7"/>
    <text x="60" y="168" font-family="Fredoka, Arial, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">Alat 2</text>
  </g>

  <!-- Card 3: Meteran Rol Saku -->
  <g transform="translate(288, 16)">
    <rect width="120" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Case -->
    <rect x="24" y="54" width="52" height="54" rx="14" fill="#f97316" stroke="#c2410c" stroke-width="2.5"/>
    <rect x="34" y="64" width="32" height="34" rx="8" fill="#334155"/>
    <!-- Pulling steel tape -->
    <rect x="74" y="92" width="34" height="12" fill="#fde047" stroke="#a16207" stroke-width="2"/>
    <path d="M 106 90 L 106 108 L 100 108" fill="none" stroke="#64748b" stroke-width="3"/>
    <rect x="20" y="150" width="80" height="26" rx="13" fill="#ffedd5"/>
    <text x="60" y="168" font-family="Fredoka, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">Alat 3</text>
  </g>

  <!-- Card 4: Timbangan Kue -->
  <g transform="translate(424, 16)">
    <rect width="120" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Tray -->
    <path d="M 28 48 L 92 48 L 82 60 L 38 60 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <!-- Body -->
    <path d="M 36 66 L 84 66 L 94 126 L 26 126 Z" fill="#a855f7" stroke="#7e22ce" stroke-width="2.2"/>
    <circle cx="60" cy="96" r="20" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <line x1="60" y1="96" x2="60" y2="80" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="96" r="3" fill="#334155"/>
    <rect x="20" y="150" width="80" height="26" rx="13" fill="#f3e8ff"/>
    <text x="60" y="168" font-family="Fredoka, Arial, sans-serif" font-size="14" font-weight="700" fill="#7e22ce" text-anchor="middle">Alat 4</text>
  </g>
</svg>
