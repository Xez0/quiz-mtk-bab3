<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 245" role="img" aria-label="Neraca dua lengan seimbang dengan apel di sisi kiri dan anak timbangan 1 kg dan 500 g di sisi kanan">
  <rect width="480" height="245" rx="16" fill="#f8fafc"/>
  <!-- Stand Base -->
  <rect x="170" y="208" width="140" height="22" rx="8" fill="#475569"/>
  <rect x="232" y="72" width="16" height="136" fill="#64748b"/>
  <!-- Center Equal Arrow Indicator -->
  <polygon points="240,42 232,62 248,62" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="240" y="34" font-family="Fredoka, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">SEIMBANG</text>

  <!-- Horizontal Beam (0 tilt) -->
  <rect x="92" y="68" width="296" height="12" rx="6" fill="#334155"/>
  <circle cx="240" cy="74" r="9" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>

  <!-- Left Pan Strings -->
  <line x1="112" y1="80" x2="72" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <line x1="112" y1="80" x2="152" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <!-- Apples on Left Pan -->
  <circle cx="96" cy="136" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="126" cy="136" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="111" cy="122" r="14" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>
  <path d="M 111 108 L 114 101" stroke="#65a30d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Pan -->
  <path d="M 60 152 L 164 152 L 152 168 L 72 168 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2.2"/>

  <!-- Right Pan Strings -->
  <line x1="368" y1="80" x2="320" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <line x1="368" y1="80" x2="416" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <!-- Brass Weight 1 kg -->
  <rect x="326" y="106" width="44" height="46" rx="4" fill="#facc15" stroke="#a16207" stroke-width="2.2"/>
  <rect x="340" y="98" width="16" height="8" rx="3" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  <text x="348" y="135" font-family="Fredoka, Arial, sans-serif" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">1 kg</text>
  <!-- Brass Weight 500 g -->
  <rect x="376" y="118" width="36" height="34" rx="4" fill="#fde047" stroke="#a16207" stroke-width="2.2"/>
  <rect x="388" y="111" width="12" height="7" rx="2" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  <text x="394" y="140" font-family="Fredoka, Arial, sans-serif" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">500 g</text>
  <!-- Right Pan -->
  <path d="M 310 152 L 426 152 L 414 168 L 322 168 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2.2"/>
</svg>
