    <text x="416.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">10</text>
    <line x1="435.0" y1="108" x2="435.0" y2="123" stroke="#334155" stroke-width="1.5"/>
    <line x1="454.0" y1="108" x2="454.0" y2="130" stroke="#1e293b" stroke-width="2.2"/>
    <text x="454.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">11</text>
    <line x1="473.0" y1="108" x2="473.0" y2="123" stroke="#334155" stroke-width="1.5"/>
    <line x1="492.0" y1="108" x2="492.0" y2="130" stroke="#1e293b" stroke-width="2.2"/>
    <text x="492.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">12</text>
  <text x="530" y="150" font-family="Nunito, Arial, sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="end">cm</text>
