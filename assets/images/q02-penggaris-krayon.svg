    <text x="340.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">8</text>
    <line x1="359.0" y1="108" x2="359.0" y2="123" stroke="#334155" stroke-width="1.5"/>
    <line x1="378.0" y1="108" x2="378.0" y2="130" stroke="#1e293b" stroke-width="2.2"/>
    <text x="378.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">9</text>
    <line x1="397.0" y1="108" x2="397.0" y2="123" stroke="#334155" stroke-width="1.5"/>
