    <line x1="55.0" y1="108" x2="55.0" y2="123" stroke="#334155" stroke-width="1.5"/>
    <line x1="74.0" y1="108" x2="74.0" y2="130" stroke="#1e293b" stroke-width="2.2"/>
    <text x="74.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
    <line x1="93.0" y1="108" x2="93.0" y2="123" stroke="#334155" stroke-width="1.5"/>
    <line x1="112.0" y1="108" x2="112.0" y2="130" stroke="#1e293b" stroke-width="2.2"/>
    <text x="112.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">2</text>
