    <text x="150.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">3</text>
    <line x1="169.0" y1="108" x2="169.0" y2="123" stroke="#334155" stroke-width="1.5"/>
    <line x1="188.0" y1="108" x2="188.0" y2="130" stroke="#1e293b" stroke-width="2.2"/>
    <text x="188.0" y="150" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">4</text>
