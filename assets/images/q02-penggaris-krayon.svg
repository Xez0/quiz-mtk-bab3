<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-label="Krayon diletakkan di penggaris dari angka 2 cm sampai 8 cm">
  <rect width="560" height="190" rx="16" fill="#f8fafc"/>
  <!-- Guide lines -->
  <line x1="112" y1="45" x2="112" y2="108" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="5,4"/>
  <line x1="340" y1="45" x2="340" y2="108" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="5,4"/>

  <!-- Crayon from x=112 to x=340 -->
  <g transform="translate(0, 48)">
    <!-- Flat base at x=112 -->
    <rect x="112" y="4" width="184" height="28" rx="3" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
    <!-- Paper wrapper bands -->
    <rect x="128" y="4" width="12" height="28" fill="#0f172a" opacity="0.75"/>
    <rect x="150" y="4" width="118" height="28" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="276" y="4" width="12" height="28" fill="#0f172a" opacity="0.75"/>
    <!-- Wave decoration -->
    <path d="M 168 18 Q 182 10 196 18 T 224 18 T 252 18" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    <!-- Tip tapering to x=340 -->
    <polygon points="296,5 340,15 340,21 296,31" fill="#38bdf8" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Ruler -->
