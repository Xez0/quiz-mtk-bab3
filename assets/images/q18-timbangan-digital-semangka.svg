  <rect x="136" y="178" width="148" height="34" rx="4" fill="#d9f99d"/>
  <text x="210" y="203" font-family="Courier New, monospace" font-size="24" font-weight="900" fill="#14532d" text-anchor="middle">2.500 g</text>
</svg>
