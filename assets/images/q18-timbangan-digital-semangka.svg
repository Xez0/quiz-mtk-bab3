<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 245" role="img" aria-label="Timbangan digital menimbang semangka menunjukkan 2.500 g">
  <rect width="420" height="245" rx="16" fill="#f8fafc"/>
  <!-- Striped Watermelon -->
  <ellipse cx="210" cy="86" rx="64" ry="52" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <path d="M 178 40 Q 168 86 178 132" fill="none" stroke="#14532d" stroke-width="6" stroke-linecap="round"/>
  <path d="M 210 34 L 210 138" fill="none" stroke="#14532d" stroke-width="7" stroke-linecap="round"/>
  <path d="M 242 40 Q 252 86 242 132" fill="none" stroke="#14532d" stroke-width="6" stroke-linecap="round"/>
  <!-- Little curly stem -->
  <path d="M 210 34 Q 214 20 226 24" fill="none" stroke="#65a30d" stroke-width="4" stroke-linecap="round"/>

  <!-- Digital Flat Plate -->
